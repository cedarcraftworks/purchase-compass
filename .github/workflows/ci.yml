name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyzer:
    name: Analyzer (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/analyzer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/analyzer/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Test (and regenerate the API contract)
        run: pytest
        env:
          UPDATE_CONTRACT: "1"
      - name: Share the freshly generated contract with the TypeScript job
        uses: actions/upload-artifact@v7
        with:
          name: contract
          path: contract/

  typescript:
    name: API and web (TypeScript)
    needs: analyzer
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: purchase_compass_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/purchase_compass_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Use the contract the analyzer just produced
        uses: actions/download-artifact@v8
        with:
          name: contract
          path: contract/
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test API (includes the contract test)
        run: npm test --workspace=@purchase-compass/api
      - name: Test web (components and demo data)
        run: npm test --workspace=@purchase-compass/web
      - name: Build
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build
