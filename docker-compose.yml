# One command starts everything:  docker compose up --build
# then open http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: purchase_compass
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30

  analyzer:
    build: ./services/analyzer
    environment:
      # Optional: set in a .env file to recommend real Rakuten products.
      RAKUTEN_APP_ID: ${RAKUTEN_APP_ID:-}
      RAKUTEN_ACCESS_KEY: ${RAKUTEN_ACCESS_KEY:-}

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/purchase_compass
      ANALYZER_URL: http://analyzer:8000
      SEED_ON_START: ${SEED_ON_START:-true}
      DEMO_MODE: ${DEMO_MODE:-false}
    depends_on:
      db:
        condition: service_healthy
      analyzer:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  db-data:
