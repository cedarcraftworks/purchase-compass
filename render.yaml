# Render Blueprint for the public demo (see docs/deploy.md).
# autoDeploy is off: GitHub Actions deploys only after CI passes.
services:
  - type: web
    name: purchase-compass-analyzer
    runtime: docker
    dockerContext: services/analyzer
    dockerfilePath: services/analyzer/Dockerfile
    autoDeploy: false
    healthCheckPath: /healthz
    envVars:
      - key: RAKUTEN_APP_ID
        sync: false

  - type: web
    name: purchase-compass-api
    runtime: docker
    dockerContext: .
    dockerfilePath: apps/api/Dockerfile
    autoDeploy: false
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: purchase-compass-db
          property: connectionString
      - key: ANALYZER_URL
        sync: false # https://purchase-compass-analyzer.onrender.com
      - key: DEMO_MODE
        value: "true"
      - key: SEED_ON_START
        value: "true"

  - type: web
    name: purchase-compass-web
    runtime: docker
    dockerContext: .
    dockerfilePath: apps/web/Dockerfile
    autoDeploy: false
    envVars:
      - key: API_URL
        sync: false # https://purchase-compass-api.onrender.com

databases:
  - name: purchase-compass-db
    databaseName: purchase_compass
